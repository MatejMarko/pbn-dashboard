<form [formGroup]="loginForm" style="display: flex; flex-direction: column; gap: 12px; width: 400px;" (ngSubmit)="login()">
  <otp-form-field>
    <otp-label>Username</otp-label>
    <input otp-input type="text" formControlName="username" />
    <otp-error>Username is required</otp-error>
  </otp-form-field>
  <otp-form-field>
    <otp-label>Password</otp-label>
    <input otp-input type="password" formControlName="password" />
    <otp-error>Invalid username or password</otp-error>
  </otp-form-field>
  <button ds-button type="submit">Log in</button>
</form>
