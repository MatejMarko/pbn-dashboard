<table role="grid" [attr.aria-label]="gridLabel()">
  <tbody>
    @for (row of grid(); track $index) {
      <tr>
        @for (cell of row; track cell.month) {
          <td>
            <button #monthBtn
                    type="button"
                    [class.selected]="isSelected(cell.month)"
                    [attr.aria-selected]="isSelected(cell.month)"
                    [attr.aria-disabled]="isDisabled(cell.month) || null"
                    [attr.tabindex]="getTabIndex(cell.month)"
                    [disabled]="isDisabled(cell.month)"
                    (click)="onMonthClick(cell.month)">
              {{ cell.label }}
            </button>
          </td>
        }
      </tr>
    }
  </tbody>
</table>
