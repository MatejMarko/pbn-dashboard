<button
  #triggerBtn
  type="button"
  cdkOverlayOrigin
  #trigger="cdkOverlayOrigin"
  class="chip"
  [class.chip--active]="isActive()"
  [disabled]="disabled()"
  [attr.aria-haspopup]="'listbox'"
  [attr.aria-expanded]="open()"
  (click)="onTriggerClick()"
  (keydown)="onTriggerKeydown($event)"
>
  <span class="chip__label">{{ chipLabel() }}</span>
  <otp-svg class="chip__arrow" [name]="open() ? svgNames.ARROW_UP_16 : svgNames.ARROW_DOWN_16" size="1rem" />
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="overlayPositions"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  (backdropClick)="close()"
  (overlayKeydown)="onOverlayKeydown($event)"
>
  <div class="panel" role="listbox" [attr.aria-label]="label()" [attr.aria-multiselectable]="multiselect() || null">
    <div class="panel__options">
      @for (option of options(); track option.id) {
        <div
          class="panel__option"
          [class.panel__option--selected]="isSelected(option)"
          role="option"
          [attr.aria-selected]="isSelected(option)"
          tabindex="-1"
          (click)="onOptionClick(option)"
          (keydown)="onOptionKeydown($event, option)"
        >
          @if (multiselect()) {
            <input
              type="checkbox"
              class="panel__checkbox"
              [checked]="isSelected(option)"
              aria-hidden="true"
              tabindex="-1"
            />
          }
          <span class="panel__option-label">{{ option.label }}</span>
          @if (option.icon) {
            <otp-svg class="panel__option-icon" [name]="option.icon" size="1.5rem" />
          }
        </div>
      }
    </div>
    @if (showReset()) {
      <div class="panel__reset">
        <button type="button" class="panel__reset-btn" (click)="onReset()">
          <otp-svg [name]="svgNames.REFRESH_16" size="1rem" />
          Reset
        </button>
      </div>
    }
  </div>
</ng-template>
